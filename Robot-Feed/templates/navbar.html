<style>
    /* Estilos da Barra de Navegação */
    .app-nav {
        background-color: #2c3e50;
        padding: 0 20px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        display: flex;
        align-items: center;
        margin-bottom: 20px;
    }
    
    .app-nav a {
        display: inline-block;
        padding: 15px 20px;
        color: #bdc3c7;
        text-decoration: none;
        font-weight: bold;
        font-family: sans-serif;
        border-bottom: 3px solid transparent;
        transition: all 0.3s ease;
    }

    .app-nav a:hover {
        color: #ecf0f1;
        background-color: #34495e;
    }

    .app-nav a.active {
        color: #ffffff;
        border-bottom-color: #3498db;
        background-color: #34495e;
    }
</style>

<nav class="app-nav">
    <a href="{{ url_for('monitor.index') }}" class="{% if active_page == 'monitor' %}active{% endif %}">
        📺 Monitor YouTube
    </a>
    <a href="{{ url_for('leiloes.leiloes_index') }}" class="{% if active_page == 'leiloes' %}active{% endif %}">
        🔨 Garimpo de Leilões
    </a>
    <a href="{{ url_for('resumo.resumo_index') }}" class="{% if active_page == 'resumo' %}active{% endif %}">
        📝 Resumo de Vídeo
    </a>
    <a href="{{ url_for('resumo.cofre_index') }}" class="{% if active_page == 'cofre' %}active{% endif %}">
        🗄️ Cofre
    </a>
    <a href="{{ url_for('monitor.docs_index') }}" class="{% if active_page == 'docs' %}active{% endif %}">
        📚 Docs da API
    </a>
</nav>
