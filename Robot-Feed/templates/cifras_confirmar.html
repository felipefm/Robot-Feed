<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar importação - Cifras - Robot Feed</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }

        .card { box-shadow: 0 8px 20px rgba(0,0,0,0.05); border: none; border-radius: 12px; }
        .card-header { font-weight: bold; background-color: white; border-bottom: 1px solid #f0f0f0; border-radius: 12px 12px 0 0 !important; }
    </style>
</head>
<body>
    {% include 'navbar.html' %}

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">

                <div class="card mb-4">
                    <div class="card-header">
                        <i class="fas fa-triangle-exclamation"></i> Cifra já existente
                    </div>
                    <div class="card-body">
                        <p class="mb-3">
                            Já existe uma cifra para
                            <strong>{{ titulo }}{% if artista %} &mdash; {{ artista }}{% endif %}</strong>.
                            O que deseja fazer?
                        </p>

                        <div class="d-flex flex-wrap gap-2">
                            <form method="POST" action="{{ url_for('cifras.importar') }}">
                                <input type="hidden" name="url" value="{{ url }}">
                                <input type="hidden" name="acao" value="sobrescrever">
                                <button type="submit" class="btn btn-warning fw-bold">
                                    <i class="fas fa-rotate"></i> Sobrescrever a existente
                                </button>
                            </form>
                            <form method="POST" action="{{ url_for('cifras.importar') }}">
                                <input type="hidden" name="url" value="{{ url }}">
                                <input type="hidden" name="acao" value="nova_versao">
                                <button type="submit" class="btn btn-outline-primary fw-bold">
                                    <i class="fas fa-plus"></i> Salvar como nova versão
                                </button>
                            </form>
                            <a href="{{ url_for('cifras.index') }}" class="btn btn-outline-secondary">
                                Cancelar
                            </a>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
